name: Django LTS security upgrade check
on:
  pull_request:
permissions:
  contents: read
jobs:
  django-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-only-not-a-production-secret
      CLOUDINARY_CLOUD_NAME: ci-test
      CLOUDINARY_API_KEY: '123456'
      CLOUDINARY_API_SECRET: ci-test-secret
      STRIPE_PUBLIC_KEY: ci-test
      STRIPE_SECRET_KEY: ci-test
      STRIPE_WH_SECRET: ci-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python -m compileall -q yachtsescape booking home profiles yachts
